name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Pinned: the apt ffmpeg below is the runner image's, so a moving
    # ubuntu-latest would move the version the video tests run against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.22"
          enable-cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The video tests (requires_ffmpeg) skip without it. Use the runner
      # image's packaged ffmpeg: no downloaded nightly, no unverified binary.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - run: make install
      # UV_LOCKED makes a stale lock an error in make install; assert that the
      # install neither re-resolved nor rewrote the committed lock (PKG-001).
      - run: git diff --exit-code -- backend/uv.lock
      - run: make fe-install

      # Lint, typecheck and tests for the backend, then svelte-check.
      - run: ./check.sh
